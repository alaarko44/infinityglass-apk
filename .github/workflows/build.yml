name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Folders and Build
        run: |
          # 1. Klasörleri otomatik oluştur
          mkdir -p app/src/main/java/com/infinityglass/admin
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          # 2. Logonuzu indirin (Kendi logonuzun olduğu URL'yi buraya yazın)
          # Eğer GitHub'da yüklü değilse, URL kısmına logonuzun olduğu bir linki yapıştırın.
          wget -O app/src/main/res/drawable/logo.png https://raw.githubusercontent.com/alaarl/infinityglass-apk/main/logo.png

          # 3. Diğer tüm dosyaları oluştur
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.infinityglass.admin">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application 
                  android:label="Infinity Admin" 
                  android:usesCleartextTraffic="true"
                  android:icon="@drawable/logo"
                  android:roundIcon="@drawable/logo"
                  android:theme="@style/Theme.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<EOF > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.NoActionBar" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">false</item>
              </style>
          </resources>
          EOF

          cat <<EOF > app/src/main/java/com/infinityglass/admin/MainActivity.java
          package com.infinityglass.admin;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.CookieManager;
          import android.view.Window;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  WebView w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("https://infinityglass.gt.tc/admin");
                  setContentView(w);
              }
          }
          EOF

          # Gerekli gradle dosyalarını oluştur
          cat <<EOF > build.gradle
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat <<EOF > settings.gradle
          include ':app'
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.infinityglass.admin'
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.infinityglass.admin"
                  minSdkVersion 21
                  targetSdkVersion 33
              }
          }
          EOF

          # Derleme
          wget https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip
          ./gradle-7.5/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
