name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Build With Pre-installed Gradle
        run: |
          # 1. Proje yapısını oluştur
          mkdir -p app/src/main/java/com/infinityglass/admin
          
          # 2. Settings dosyası (Gradle'ı başlatmak için şart)
          echo "rootProject.name='InfinityAdmin'" > settings.gradle
          echo "include ':app'" >> settings.gradle
          
          # 3. Root build dosyası
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:7.4.2' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          
          # 4. App build dosyası
          echo "apply plugin: 'com.android.application'" > app/build.gradle
          echo "android { compileSdkVersion 33; defaultConfig { applicationId 'com.infinityglass.admin'; minSdkVersion 21; targetSdkVersion 33 } }" >> app/build.gradle
          
          # 5. Manifest
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.infinityglass.admin">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="Infinity Admin" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 6. MainActivity
          cat <<EOF > app/src/main/java/com/infinityglass/admin/MainActivity.java
          package com.infinityglass.admin;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("https://infinityglass.gt.tc/admin");
                  setContentView(w);
              }
          }
          EOF

          # 7. Derleme (Wrapper olmadan doğrudan gradle komutuyla)
          /usr/share/gradle/bin/gradle assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with: { name: app-debug, path: app/build/outputs/apk/debug/app-debug.apk }
