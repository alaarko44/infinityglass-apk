name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK (Force Print)
        run: |
          mkdir -p app/src/main/java/com/infinityglass/admin
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          if [ -f logo.png ]; then cp logo.png app/src/main/res/drawable/logo.png; fi

          cat <<EOF > settings.gradle
          rootProject.name = 'InfinityAdmin'
          include ':app'
          EOF

          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.infinityglass.admin'
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.infinityglass.admin"
                  minSdkVersion 21
                  targetSdkVersion 33
              }
          }
          EOF

          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.infinityglass.admin">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application 
                  android:label="Infinity Admin" 
                  android:usesCleartextTraffic="true"
                  android:icon="@drawable/logo"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<EOF > app/src/main/java/com/infinityglass/admin/MainActivity.java
          package com.infinityglass.admin;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.WebResourceRequest;

          public class MainActivity extends Activity {
              private WebView w;
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  w = new WebView(this);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  
                  w.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          String url = req.getUrl().toString();
                          if (url.startsWith("javascript:window.print()")) {
                              createPrintJob(view);
                              return true;
                          }
                          return false;
                      }
                  });
                  
                  w.loadUrl("https://infinityglass.gt.tc/admin");
                  setContentView(w);
              }

              private void createPrintJob(WebView webView) {
                  PrintManager printManager = (PrintManager) this.getSystemService(PRINT_SERVICE);
                  printManager.print("Fatura", webView.createPrintDocumentAdapter("Fatura"), new PrintAttributes.Builder().build());
              }
          }
          EOF

          wget https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip
          ./gradle-7.5/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
