name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: |
          mkdir -p app/src/main/java/com/infinityglass/admin
          
          # 1. settings.gradle (pluginManagement ve Repositories burada olacak)
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name='InfinityAdmin'
          include ':app'
          EOF

          # 2. build.gradle (Sadece plugin tanımları, management blokları yok)
          cat <<EOF > build.gradle
          plugins {
              id 'com.android.application' version '8.0.0' apply false
          }
          EOF

          # 3. app/build.gradle
          mkdir -p app
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.infinityglass.admin'
              compileSdk 33
              defaultConfig {
                  applicationId "com.infinityglass.admin"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 1
              }
          }
          EOF
          
          # 4. Manifest
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.infinityglass.admin">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="Infinity Admin" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 5. MainActivity
          cat <<EOF > app/src/main/java/com/infinityglass/admin/MainActivity.java
          package com.infinityglass.admin;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("https://infinityglass.gt.tc/admin");
                  setContentView(w);
              }
          }
          EOF
          
          gradle wrapper
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: app/build/outputs/apk/debug/app-debug.apk }
