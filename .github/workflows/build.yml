name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Auto Init and Build
        run: |
          # 1. Gradle'ı otomatik başlat, boş bir proje kur
          gradle init --type basic --dsl groovy --project-name infinityadmin --package com.infinityglass.admin --incubating
          
          # 2. Android yapısını manuel olarak ekle
          mkdir -p app/src/main/java/com/infinityglass/admin
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 33
              defaultConfig { applicationId "com.infinityglass.admin"; minSdkVersion 21; targetSdkVersion 33 }
          }
          EOF
          
          # 3. Manifest ve Main kodunu yaz
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest package="com.infinityglass.admin"><application android:label="Infinity Admin" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          
          cat <<EOF > app/src/main/java/com/infinityglass/admin/MainActivity.java
          package com.infinityglass.admin;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.loadUrl("https://infinityglass.gt.tc/admin");
                  setContentView(w);
              }
          }
          EOF
          
          # 4. Derle
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: build/outputs/apk/debug/app-debug.apk }
